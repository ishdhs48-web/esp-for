name: Build oar_esp DLL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: MSVC x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (via Developer Command Prompt)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64   # sets CL.EXE + LINK.EXE on PATH before cmake runs

      - name: Configure CMake
        run: |
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        # NMake Makefiles does not accept -DCMAKE_GENERATOR_PLATFORM.
        # Architecture is controlled by the MSVC dev-cmd arch above (amd64 = x64).

      - name: Build
        run: cmake --build build

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: oar_esp-${{ github.sha }}
          path: build/oar_esp.dll
          if-no-files-found: error

      - name: Upload PDB (Debug symbols, Debug build only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: oar_esp-pdb-${{ github.sha }}
          path: build/oar_esp.pdb
          if-no-files-found: ignore
          
